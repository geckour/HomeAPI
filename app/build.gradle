plugins {
    id 'com.android.application'
    id 'kotlinx-serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "com.geckour.homeapi"
        minSdkVersion 31
        targetSdkVersion 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def releaseSettingGradleFile = new File("${project.rootDir}/app/signing/release.gradle")
            apply from: releaseSettingGradleFile, to: android
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_18
        targetCompatibility JavaVersion.VERSION_18
    }

    kotlin {
        compilerOptions {
            freeCompilerArgs.add("-Xopt-in=kotlin.RequiresOptIn")
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    namespace 'com.geckour.homeapi'
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation platform('com.google.firebase:firebase-bom:34.18.0')

    // Crashlytics
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    // Messaging
    implementation 'com.google.firebase:firebase-messaging'

    // KTX
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // DI
    def koin_version = "3.4.0"
    implementation "io.insert-koin:koin-android:$koin_version"
    implementation "io.insert-koin:koin-androidx-compose:$koin_version"
    testImplementation "io.insert-koin:koin-test:$koin_version"

    // Jetpack
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.navigation:navigation-compose:2.9.8"

    // Network Request
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation platform('com.squareup.okhttp3:okhttp-bom:5.5.0')
    implementation 'com.squareup.okhttp3:okhttp'
    implementation 'com.squareup.okhttp3:logging-interceptor'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0"

    // Compose
    implementation "androidx.compose.animation:animation:1.12.0"
    implementation "androidx.compose.foundation:foundation:1.12.0"
    implementation "androidx.compose.foundation:foundation-layout:1.12.0"
    implementation "androidx.compose.material:material:1.12.0"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    implementation "androidx.compose.runtime:runtime:1.12.0"
    implementation "androidx.compose.runtime:runtime-livedata:1.12.0"
    implementation "androidx.compose.ui:ui:1.12.0"
    implementation "androidx.compose.ui:ui-tooling:1.12.0"
    implementation "androidx.compose.foundation:foundation:1.12.0"

    // Sleep Detection
    implementation 'com.google.android.gms:play-services-location:21.4.0'
}